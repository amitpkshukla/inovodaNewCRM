version: '3.8'

services:
  # ============================================================================
  # 1. PostgreSQL Database with pg_trgm & unaccent extensions enabled
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: sales_os_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: sales_os
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    command: >
      postgres
      -c shared_preload_libraries=pg_trgm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sales_os && psql -U postgres -d sales_os -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm;'"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 2. FastAPI Backend Service (Python, Regex Perception, pd.melt unpivot)
  # ============================================================================
  fastapi:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sales_os_fastapi
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/sales_os
      - APP_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # ============================================================================
  # 3. Next.js Frontend Service (App Router, Tailwind CSS, Account 360)
  # ============================================================================
  nextjs:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: sales_os_nextjs
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - fastapi

volumes:
  pgdata:
    driver: local
